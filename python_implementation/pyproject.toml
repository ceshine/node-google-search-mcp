[project]
name = "google-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.3",
    "playwright>=1.55.0",
    "beautifulsoup4>=4.13.5",
]

[project.scripts]
google-search-server = "google_search_server.main:mcp.run"
google-search = "google_search_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
